<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Embudo · Taller de email marketing</title>
  <meta name="description" content="Embudo: ordena tus contactos, crea segmentos, diseña emails por bloques y dibuja tus automatizaciones. Todo en tu navegador.">
  <meta name="theme-color" content="#6B2737">
  <!-- Icono de la pestaña: el embudo de tres líneas, dibujado en SVG dentro del propio enlace. -->
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%236B2737'/%3E%3Cg stroke='%23F6EDE6' stroke-width='3.2' stroke-linecap='round'%3E%3Cpath d='M7 10h18M10.5 16h11M14 22h4'/%3E%3C/g%3E%3C/svg%3E">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <!-- Cabecera solo para el móvil (en el ordenador se ve la barra lateral). -->
  <header class="cabecera-movil">
    <a class="marca" href="#/inicio" aria-label="Embudo, ir a la portada">
      <svg class="logo" viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" aria-hidden="true"><path d="M3.5 6h17M7 12h10M10.5 18h3"/></svg>
      <span>Embudo</span>
    </a>
    <span class="nota-movil"><span data-icono="candado"></span>Solo en este navegador</span>
  </header>

  <div class="app">
    <aside class="barra">
      <a class="marca" href="#/inicio" aria-label="Embudo, ir a la portada">
        <span class="logo-caja">
          <svg class="logo" viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" aria-hidden="true"><path d="M3.5 6h17M7 12h10M10.5 18h3"/></svg>
        </span>
        <span class="marca-nombre">Embudo</span>
      </a>

      <nav class="menu" aria-label="Secciones">
        <a class="menu-item" href="#/contactos" data-seccion="contactos"><span data-icono="contactos"></span><span class="menu-texto">Contactos</span><span class="insignia" hidden></span></a>
        <a class="menu-item" href="#/segmentos" data-seccion="segmentos"><span data-icono="segmentos"></span><span class="menu-texto">Segmentos</span><span class="insignia" hidden></span></a>
        <a class="menu-item" href="#/emails" data-seccion="emails"><span data-icono="emails"></span><span class="menu-texto">Emails</span><span class="insignia" hidden></span></a>
        <a class="menu-item" href="#/automatizaciones" data-seccion="automatizaciones"><span data-icono="automatizaciones"></span><span class="menu-texto">Automatizaciones</span><span class="insignia" hidden></span></a>
        <a class="menu-item" href="#/ajustes" data-seccion="ajustes"><span data-icono="ajustes"></span><span class="menu-texto">Ajustes</span></a>
      </nav>

      <p class="barra-nota"><span data-icono="candado"></span>Tus datos están solo en este navegador</p>
    </aside>

    <!-- Aquí app.js pinta la pantalla de cada sección. -->
    <main id="vista" class="vista" tabindex="-1"></main>
  </div>

  <!-- Capas para ventanas, avisos y sugerencias de etiquetas. -->
  <div id="capa-modales"></div>
  <div id="avisos" aria-live="polite"></div>
  <datalist id="lista-etiquetas"></datalist>

  <!-- type="module" carga app.js después del HTML y permite usar import/export. -->
  <script type="module" src="app.js"></script>
</body>
</html>
